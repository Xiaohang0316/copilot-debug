<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc1ff"/>
      <stop offset="50%" style="stop-color:#89d185"/>
      <stop offset="100%" style="stop-color:#4fc1ff"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc1ff"/>
      <stop offset="100%" style="stop-color:#0078d4"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c586c0"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="40" ry="40" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#4fc1ff" stroke-width="0.5">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- Context window brackets -->
  <g filter="url(#glow)">
    <!-- Left bracket { -->
    <path d="M 58 80 Q 48 80 48 90 L 48 118 Q 48 128 38 128 Q 48 128 48 138 L 48 166 Q 48 176 58 176"
          fill="none" stroke="url(#bracket)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right bracket } -->
    <path d="M 198 80 Q 208 80 208 90 L 208 118 Q 208 128 218 128 Q 208 128 208 138 L 208 166 Q 208 176 198 176"
          fill="none" stroke="url(#bracket)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Eye shape (monitoring/viewing) -->
  <g filter="url(#softglow)">
    <!-- Eye outline -->
    <path d="M 70 128 Q 128 85 186 128 Q 128 171 70 128 Z"
          fill="none" stroke="url(#eye)" stroke-width="3.5" opacity="0.9"/>
    <!-- Iris -->
    <circle cx="128" cy="128" r="22" fill="none" stroke="url(#eye)" stroke-width="3" opacity="0.9"/>
    <!-- Pupil -->
    <circle cx="128" cy="128" r="10" fill="#4fc1ff" opacity="0.8"/>
    <!-- Pupil highlight -->
    <circle cx="122" cy="123" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Pulse/waveform line (debugging/monitoring signal) -->
  <g filter="url(#glow)">
    <polyline points="28,200 58,200 72,200 82,185 92,215 102,190 112,210 120,195 128,200 148,200 158,200 168,185 178,215 188,200 228,200"
              fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Small data dots on the pulse -->
  <circle cx="82" cy="185" r="2.5" fill="#89d185" opacity="0.8"/>
  <circle cx="102" cy="190" r="2.5" fill="#4fc1ff" opacity="0.8"/>
  <circle cx="168" cy="185" r="2.5" fill="#89d185" opacity="0.8"/>

  <!-- Compression indicator (small arrows in top-right) -->
  <g transform="translate(195, 52)" opacity="0.7">
    <polyline points="0,0 8,6 0,12" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="16,12 8,6 16,0" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
